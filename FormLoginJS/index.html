<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center vh-100 bg-light">

<div class="card p-3" style="width:300px;">
  <h5 class="text-center">Login</h5>

  <input type="text" id="username" class="form-control mb-2" placeholder="Username">

  <div class="input-group mb-2">
    <input type="password" id="password" class="form-control" placeholder="Password">
    <button class="btn btn-outline-secondary" onclick="togglePassword()">
      <i id="icon" class="bi bi-eye"></i>
    </button>
  </div>

  <button class="btn btn-primary" onclick="login()">Login</button>
</div>

<!-- Popup -->
<div class="modal fade" id="popup">
  <div class="modal-dialog">
    <div class="modal-content text-center p-3">
      <p id="hasil"></p>
      <button class="btn btn-primary" data-bs-dismiss="modal">OK</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
function login(){
  let nama = document.getElementById("username").value;
  let sandi = document.getElementById("password").value;
  let hasil = document.getElementById("hasil");

  if(nama=="wildan" && sandi=="20381"){
    hasil.innerText="Login Berhasil";
  } else {
    hasil.innerText="Login Gagal";
  }

  new bootstrap.Modal(document.getElementById('popup')).show();
}

function togglePassword(){
  let password = document.getElementById("password");
  let icon = document.getElementById("icon");

  if(password.type=="password"){
    password.type="text";
    icon.classList.replace("bi-eye","bi-eye-slash");
  } else {
    password.type="password";
    icon.classList.replace("bi-eye-slash","bi-eye");
  }
}
</script>

</body>
</html>
